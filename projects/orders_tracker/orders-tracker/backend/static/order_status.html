<!DOCTYPE html>
<html>
<head>
    <title>Статусы заказов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #333;
        }
        table { 
            border-collapse: collapse; 
            width: 80%;
            margin-top: 15px;
        }
        th, td { 
            border: 1px solid #ccc; 
            padding: 8px; 
            text-align: left; 
        }
        th { 
            background-color: #f2f2f2; 
        }
        a.button, button {
            display: inline-block;
            background-color: #4676D7;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        a.button:hover, button:hover {
            background-color: #3355aa;
        }
    </style>
</head>
<body>
    <a href="/admin" class="button">Вернуться в админку</a>

    <h2>Список всех заказов</h2>
    <table>
        <thead>
            <tr>
                <th>ID заказа</th>
                <th>Название</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody>
            {{range .}}
            <tr>
                <td>{{.ID}}</td>
                <td>{{.Name}}</td>
                <td>{{.Status}}</td>
            </tr>
            {{else}}
            <tr><td colspan="3">Заказы отсутствуют</td></tr>
            {{end}}
        </tbody>
    </table>
</body>
</html>
