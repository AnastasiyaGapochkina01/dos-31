# dvps-lessons - generated by script
server {
    listen 80;
    server_name devops.less.fun;
    
    access_log /var/log/nginx/devops.less.fun.access.log;
    error_log /var/log/nginx/devops.less.fun.error.log;
    
    
    
    location / {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
    }
    
    
    location api {
        proxy_pass http://api:8001/api;
    }
    
    location lessons {
        proxy_pass http://localhost:8000/lessons;
    }
    
}