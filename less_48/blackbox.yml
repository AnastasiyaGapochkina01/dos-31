modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"] 
      valid_status_codes: [200]
      method: GET 
      preferred_ip_protocol: "ip4" IPv4 предпочтительнее IPv6
      tls_config: 
        insecure_skip_verify: false 
  http_post:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      method: POST
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
